[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "debyko-ccxt"
version = "0.1.0"
description = "Read-only CCXT-compatible funding, open interest and liquidations from DEBYKO"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "DEBYKO"}]
dependencies = []

[project.urls]
Repository = "https://github.com/debyko/debyko-ccxt"
Issues = "https://github.com/debyko/debyko-ccxt/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2", "twine>=6", "ccxt==4.5.92"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
