name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install wheel without runtime dependencies
        shell: bash
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --no-deps dist/*.whl
          /tmp/wheel-check/bin/python -I -c 'import sys; from debyko_ccxt import DebykoCCXT; DebykoCCXT("fake-key"); assert "ccxt" not in sys.modules'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
